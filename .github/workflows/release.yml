# Build and release whatdbg on tag push
# Creates a GitHub Release with:
#   - whatdbg-win-x64.zip   (pre-built binary, x64)
#   - whatdbg-win-arm64.zip (pre-built binary, ARM64)
#   - registry.json.zip     (mason registry index)
#   - checksums.txt
#
# Trigger: push a tag like v0.0.1
#   git tag v0.0.1
#   git push origin v0.0.1

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            artifact: whatdbg-win-x64
            generator: Ninja
            configure_flags: -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            build_flags: -- -j%NUMBER_OF_PROCESSORS%
            exe_path: Builds/Release/whatdbg_App_artefacts/Release/whatdbg.exe
          - arch: arm64
            msvc_arch: amd64_arm64
            artifact: whatdbg-win-arm64
            generator: Visual Studio 17 2022
            configure_flags: -A ARM64 -DCMAKE_SYSTEM_PROCESSOR=ARM64
            build_flags: --config Release
            exe_path: Builds/Release/whatdbg_App_artefacts/Release/whatdbg.exe

    steps:
      - name: Checkout whatdbg
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        run: |
          cmake -S . -B Builds/Release -G "${{ matrix.generator }}" ${{ matrix.configure_flags }}

      - name: Build
        run: |
          cmake --build Builds/Release ${{ matrix.build_flags }}
        shell: cmd

      - name: Package binary
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "${{ matrix.exe_path }}" dist/
          Compress-Archive -Path dist/whatdbg.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout whatdbg
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Build mason registry
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          sed -i "s|@v[0-9.]*|@${TAG}|g" packages/whatdbg/package.yaml

          pip install yq
          yq -s '.' packages/*/package.yaml > registry.json
          7z a registry.json.zip registry.json
          sha256sum registry.json registry.json.zip whatdbg-win-x64.zip whatdbg-win-arm64.zip > checksums.txt

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          {
            echo "body<<EOF"

            # Group commits by conventional commit type
            for TYPE_LABEL in "feat:Features" "fix:Fixes" "refactor:Refactors" "perf:Performance" "docs:Documentation" "ci:CI"; do
              TYPE="${TYPE_LABEL%%:*}"
              LABEL="${TYPE_LABEL##*:}"
              COMMITS=$(git log "$RANGE" --pretty=format:"- %s" --grep="^${TYPE}" 2>/dev/null)
              if [ -n "$COMMITS" ]; then
                echo "### ${LABEL}"
                echo "$COMMITS" | sed "s/^- ${TYPE}: /- /; s/^- ${TYPE}(/- (/"
                echo ""
              fi
            done

            # Uncategorized commits
            UNCATEGORIZED=$(git log "$RANGE" --pretty=format:"%s" | grep -v -E "^(feat|fix|refactor|perf|docs|ci)[:(]" || true)
            if [ -n "$UNCATEGORIZED" ]; then
              echo "### Other"
              echo "$UNCATEGORIZED" | sed 's/^/- /'
              echo ""
            fi

            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog:** [\`${PREV_TAG}...${TAG}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG})"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            whatdbg-win-x64.zip
            whatdbg-win-arm64.zip
            registry.json.zip
            checksums.txt
