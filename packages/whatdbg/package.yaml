---
name: whatdbg
description: Windows Host Abstraction Translator for dbgeng — DAP debug adapter for Windows C/C++ debugging.
homepage: https://github.com/jrengmusic/whatdbg
licenses:
  - MIT
languages:
  - C
  - C++
categories:
  - DAP

source:
  id: pkg:github/jrengmusic/whatdbg@v0.0.1
  asset:
    - target: win_x64
      file: whatdbg-win-x64.zip
      bin: whatdbg.exe
    - target: win_arm64
      file: whatdbg-win-arm64.zip
      bin: whatdbg.exe

bin:
  whatdbg: "{{source.asset.bin}}"
